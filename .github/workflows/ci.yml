name: Learning pipeline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Numerical and protocol tests
        run: python -m unittest discover -s tests -v
      - name: Quick paired experiment
        run: python -m imitation_learning run --config configs/quick.json --output outputs/ci
      - name: Save quick-run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quick-report-python-${{ matrix.python-version }}
          path: |
            outputs/ci/*.csv
            outputs/ci/*.json
            outputs/ci/*.md
            outputs/ci/*.html
            outputs/ci/figures/
          if-no-files-found: warn
          retention-days: 7
