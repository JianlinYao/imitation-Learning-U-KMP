[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imitation-learning-u-kmp"
version = "0.2.0"
description = "Reproducible 2-D movement-primitive experiments and uncertainty-aware control"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4", "pandas>=2,<4", "threadpoolctl>=3.1,<4"
]

[project.scripts]
imitation-learning = "imitation_learning.cli:main"

[tool.setuptools.packages.find]
include = ["imitation_learning*"]

[tool.setuptools.package-data]
imitation_learning = ["dashboard.html"]
